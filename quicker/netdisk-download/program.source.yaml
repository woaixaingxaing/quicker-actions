$schema: quicker.program.source.v1
variables:
  - key: clip
    varType: text
  - key: shareUrl
    varType: text
  - key: okClick
    varType: boolean
  - key: tabId
    varType: integer
  - key: matchedBy
    varType: text
    default: ""
steps:
  - id: s1
    getClipboardText:
      >>: clip
  - id: s2
    assign:
      input: "$=System.Text.RegularExpressions.Regex.Match({clip}, @\"https?://pan\\.baidu\\.com/s/[A-Za-z0-9_\\-?=&%#\\.]+\").Value"
      >>: shareUrl
  - id: s3
    if:
      condition: "$={shareUrl} == \"\""
      then:
        - id: s4
          notify:
            msg: 剪贴板里没有百度网盘分享链接
            type: Warning
      else:
        - id: s40
          subProgram: "%%f89423ad-7e45-4105-b5be-935167a18570"
          inputs:
            url:
              var: shareUrl
            locator: text
            value: 下载
            active: false
            autoFallback: true
            waitMs: 1500
            timeoutMs: 8000
          outputs:
            ok: okClick
            matched: matchedBy
            tabId: tabId
        - id: s13
          if:
            condition: "$={okClick}"
            then:
              - id: s15
                log:
                  message: '$="已点击下载按钮（后台标签页），命中方式：" + {matchedBy}'
        - id: s16
          if:
            condition: "$={okClick} == false"
            then:
              - id: s17
                notify:
                  msg: '$={tabId} == 0 ? "浏览器没有打开分享页，请检查 Chrome" : "没找到下载按钮：请确认已登录网盘且链接不需要提取码"'
                  type: Warning
