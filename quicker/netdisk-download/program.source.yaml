$schema: quicker.program.source.v1
variables:
  - key: clip
    varType: text
  - key: shareUrl
    varType: text
  - key: okClick
    varType: boolean
  - key: tabId
    varType: integer
steps:
  - id: s1
    getClipboardText:
      >>: clip
  - id: s2
    assign:
      input: "$=System.Text.RegularExpressions.Regex.Match({clip}, @\"https?://pan\\.baidu\\.com/s/[A-Za-z0-9_\\-?=&%\\.]+\").Value"
      >>: shareUrl
  - id: s3
    if:
      condition: "$={shareUrl} == \"\""
      then:
        - id: s4
          notify:
            msg: 剪贴板里没有百度网盘分享链接
            type: Warning
      else:
        - id: s5
          chromecontrol:
            operation: SetBrowser
            browser: chrome
            stopIfFail: false
        - id: s6
          chromecontrol:
            operation: OpenUrl
            url:
              var: shareUrl
            windowId: Current
            windowInfo: '{"active": true}'
            timeoutMs: 20000
            waitComplete: false
            stopIfFail: false
            outputs:
              tabId: tabId
        - id: s7
          if:
            condition: "$={tabId} > 0"
            then:
              - id: s8
                chromecontrol:
                  operation: Wait
                  tabId: "$={tabId}.ToString()"
                  selector: 'button.bottom_download_btn'
                  waitEventType: elementClickable
                  timeoutMs: "30000"
                  stopIfFail: false
              - id: s9
                chromecontrol:
                  operation: PageAction
                  tabId: "$={tabId}.ToString()"
                  pageLocator: css
                  pageLocatorValue: 'button.bottom_download_btn'
                  pageOperation: click
                  timeoutMs: "8000"
                  stopIfFail: false
                  outputs:
                    isSuccess: okClick
              - id: s11
                if:
                  condition: "$={okClick} != true"
                  then:
                    - id: s18
                      notify:
                        msg: 没找到下载按钮或点击失败，请手动处理
                        type: Warning
            else:
              - id: s14
                notify:
                  msg: 浏览器没有打开分享页，请检查 Chrome
                  type: Warning
subPrograms: []
