$schema: quicker.program.source.v1
variables:
  - key: url
    varType: text
    isInput: true
    default: ""
  - key: locator
    varType: text
    isInput: true
    default: role
  - key: value
    varType: text
    isInput: true
    default: ""
  - key: role
    varType: text
    isInput: true
    default: button
  - key: pageUrlPattern
    varType: text
    isInput: true
    default: ""
  - key: waitMs
    varType: integer
    isInput: true
    default: "2500"
  - key: timeoutMs
    varType: integer
    isInput: true
    default: "10000"
  - key: active
    varType: boolean
    isInput: true
  - key: autoFallback
    varType: boolean
    isInput: true
    default: "true"
  - key: ok
    varType: boolean
    isOutput: true
  - key: matched
    varType: text
    isOutput: true
  - key: tabId
    varType: integer
    isOutput: true
steps:
  - id: s1
    if:
      condition: '$=!string.IsNullOrWhiteSpace({url})'
      then:
        - id: s2
          chromecontrol:
            operation: OpenUrl
            url:
              var: url
            windowId: Current
            windowInfo: '$={active} ? "{\"active\":true}" : "{\"active\":false}"'
            timeoutMs: 15000
            waitComplete: true
            stopIfFail: false
            outputs:
              tabId: tabId
  - id: s3
    delay:
      delayMs:
        var: waitMs
  - id: s4
    if:
      condition: '$={locator} == "css"'
      then:
        - id: s10
          chromecontrol:
            operation: Wait
            tabId: "$={tabId} > 0 ? {tabId}.ToString() : \"\""
            selector:
              var: value
            waitEventType: elementClickable
            timeoutMs:
              var: timeoutMs
            stopIfFail: false
        - id: s5
          chromecontrol:
            operation: PageAction
            tabId: "$={tabId} > 0 ? {tabId}.ToString() : \"\""
            pageUrlPattern:
              var: pageUrlPattern
            pageLocator: css
            pageLocatorValue:
              var: value
            pageOperation: click
            timeoutMs:
              var: timeoutMs
            stopIfFail: false
            outputs:
              isSuccess: ok
      else if:
        id: s6
        condition: '$={locator} == "text"'
        then:
          - id: s7
            chromecontrol:
              operation: PageAction
              tabId: "$={tabId} > 0 ? {tabId}.ToString() : \"\""
              pageUrlPattern:
                var: pageUrlPattern
              pageLocator: text
              pageLocatorValue:
                var: value
              pageExact: true
              pageOperation: click
              timeoutMs:
                var: timeoutMs
              stopIfFail: false
              outputs:
                isSuccess: ok
        else:
          - id: s8
            chromecontrol:
              operation: PageAction
              tabId: "$={tabId} > 0 ? {tabId}.ToString() : \"\""
              pageUrlPattern:
                var: pageUrlPattern
              pageLocator: role
              pageLocatorRole:
                var: role
              pageLocatorValue:
                var: value
              pageOperation: click
              timeoutMs:
                var: timeoutMs
              stopIfFail: false
              outputs:
                isSuccess: ok
  - id: s11
    if:
      condition: "$={ok}"
      then:
        - id: s12
          assign:
            input:
              var: locator
            >>: matched
  - id: s13
    if:
      condition: "$={ok} == false && {autoFallback}"
      then:
        - id: s14
          chromecontrol:
            operation: PageAction
            tabId: "$={tabId} > 0 ? {tabId}.ToString() : \"\""
            pageLocator: text
            pageLocatorValue:
              var: value
            pageExact: true
            pageOperation: click
            timeoutMs: 4000
            stopIfFail: false
            outputs:
              isSuccess: ok
        - id: s15
          if:
            condition: "$={ok}"
            then:
              - id: s16
                assign:
                  input: "text:exact"
                  >>: matched
        - id: s17
          if:
            condition: "$={ok} == false"
            then:
              - id: s18
                chromecontrol:
                  operation: PageAction
                  tabId: "$={tabId} > 0 ? {tabId}.ToString() : \"\""
                  pageLocator: role
                  pageLocatorRole: button
                  pageLocatorValue:
                    var: value
                  pageOperation: click
                  timeoutMs: 4000
                  stopIfFail: false
                  outputs:
                    isSuccess: ok
              - id: s19
                if:
                  condition: "$={ok}"
                  then:
                    - id: s20
                      assign:
                        input: "role:button"
                        >>: matched
        - id: s21
          if:
            condition: "$={ok} == false"
            then:
              - id: s22
                chromecontrol:
                  operation: PageAction
                  tabId: "$={tabId} > 0 ? {tabId}.ToString() : \"\""
                  pageLocator: role
                  pageLocatorRole: link
                  pageLocatorValue:
                    var: value
                  pageOperation: click
                  timeoutMs: 4000
                  stopIfFail: false
                  outputs:
                    isSuccess: ok
              - id: s23
                if:
                  condition: "$={ok}"
                  then:
                    - id: s24
                      assign:
                        input: "role:link"
                        >>: matched
        - id: s25
          if:
            condition: "$={ok} == false"
            then:
              - id: s26
                chromecontrol:
                  operation: PageAction
                  tabId: "$={tabId} > 0 ? {tabId}.ToString() : \"\""
                  pageLocator: text
                  pageLocatorValue:
                    var: value
                  pageExact: false
                  pageOperation: click
                  timeoutMs: 4000
                  stopIfFail: false
                  outputs:
                    isSuccess: ok
              - id: s27
                if:
                  condition: "$={ok}"
                  then:
                    - id: s28
                      assign:
                        input: "text:fuzzy"
                        >>: matched
  - id: s29
    if:
      condition: "$={ok} == false"
      then:
        - id: s30
          assign:
            input: "notfound"
            >>: matched
  - id: s31
    log:
      message: '$="网页打开并点击：" + {value} + " → " + {matched} + "（tab " + {tabId}.ToString() + "）"'
